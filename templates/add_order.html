<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-center mb-4">Add New Order</h2>
        <div class="card shadow p-4">
           <form method="POST">
               {% csrf_token %}
               <div class="mb-3">
                   <label>Customer Name</label>
                   <input type="text" name="customer_name" class="form-control" required>
               </div>
               <div class="mb-3">
                  <label>Flower Name</label>
                  <input type="text" name="flower_name" class="form-control" required>
               </div>
               <div class="mb-3">
                  <label>Quantity</label>
                  <input type="number" name="quantity" class="form-control" min="1" required>
                </div>
                <div class="mb-3">
                   <label>Total Price</label>
                   <input type="number" name="total_price" class="form-control" step="0.01" required>
                </div>
                <button type="submit" class="btn btn-danger">Save Order</button>
                <a href="{% url 'orders' %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>

</body>
</html>
