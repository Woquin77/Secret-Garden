<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Flower</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"rel="stylesheet">
</head>
<body style="background-color: #ffccd5;">
    <div class="container mt-5">
        <h2 class="text-center mb-4">Add New Flower</h2>
        <div class="card shadow mx-auto" style="max-width: 600px;">
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                       <label class="form-label">Flower Name</label>
                       <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                       <label class="form-label">Color</label>
                       <input type="text" name="color" class="form-control" required>
                    </div>
                    <div class="mb-3">
                       <label class="form-label">Price</label>
                       <input type="number" name="price" class="form-control" step="0.01" min="0" required>
                    </div>
                    <div class="mb-3">
                       <label class="form-label">Category</label>
                       <select name="category" class="form-select" required>
                            <option value="">Select Category</option>
                            {% for value, label in categories %}
                            <option value="{{ value }}">
                                {{ label }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="text-center">
                       <button type="submit" class="btn btn-danger">Save Flower</button>
                       <a href="{% url 'flowers' %}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
