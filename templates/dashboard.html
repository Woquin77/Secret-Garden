<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowerShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
       .btn-pink { 
          background-color: #ff8fb1; 
          color: white; 
          border: none; 
        }
       .btn-pink:hover { 
           background-color: #ff6f9c; 
           color: white; 
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">
  <nav class="navbar navbar-dark bg-info">
    <div class="container">
      <a class="navbar-brand" href="{% url 'dashboard' %}">🌸 Secret Garden</a>
      <div class="d-flex gap-2">
        <a href="/flowers/" class="btn btn-pink">Flowers</a>
        <a href="/orders/" class="btn btn-pink">Order</a>
        <a href="{% url 'about' %}" class="btn btn-warning">About</a>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button class="btn btn-danger">Log out</button>
        </form>
      </div>
    </div>
  </nav>

  <div class="container text-center py-5">
        <h2>Dashboard Overview</h2>
        <div class="row justify-content-center my-4">
           <div class="col-4 col-md-3">
               <div class="card p-4 bg-info flex-column justify-content-start" style="min-height: 280px;">
                  <h6>Total Flowers</h6>
                  <h2 class="text-danger">{{ total_flowers }}</h2>
                </div>
            </div>
           <div class="col-4 col-md-3">
                <div class="card p-4 d-flex flex-column justify-content-start" style="min-height: 280px; background-color: #ff8fb1;">
                   <h6>Total Orders</h6>
                   <h2 class="text-danger">{{ total_orders }}</h2>
                </div>
            </div>
        </div>
        <a href="/flowers/" class="btn btn-danger">Manage Flowers</a>
        <a href="/orders/" class="btn btn-secondary">Manage Orders</a>
    </div>
    <footer class="mt-auto bg-secondary text-white text-center py-3">
        <p class="mb-0">&copy; 2026 Secret Garden. All rights reserved.</p>
    </footer>

</body>
</html>
