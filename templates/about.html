<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100" style="background-color: #ffe4ec;">
    <nav class="navbar navbar-dark bg-info">
       <div class="container">
           <a class="navbar-brand" href="{% url 'dashboard' %}">🌸 FlowerShop</a>
           <div class="d-flex gap-2">
               <a href="/flowers/" class="btn btn-pink">Flowers</a>
               <a href="/orders/" class="btn btn-pink">Order</a>
               <a href="{% url 'about' %}" class="btn btn-warning">About</a>
               <form method="post" action="{% url 'logout' %}">
                   {% csrf_token %}
                   <button class="btn btn-danger">Log out</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container py-5" style="max-width: 700px;">
       <h2 class="text-center mb-4">About FlowerShop</h2>
       <div class="card p-4">
          <p>FlowerShop is a small website to manage flowers and customer orders.</p>
          <p>You can add flowers with their prices, and see all orders in one table.</p>
       </div>
    </div>
    <footer class="mt-auto bg-secondary text-white text-center py-3">
        <p class="mb-0">&copy; 2026 Secret Garden. All rights reserved.</p>
    </footer>

</body>
</html>
